[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast checks that prove the API is alive and the main flow works
    regression: broader functional coverage
    negative: invalid input, auth failures and error handling
    contract: response shape validated against JSON Schema
    idempotency: duplicate / replayed request behaviour
    concurrency: parallel requests and race conditions
    ratelimit: throttling behaviour
    db: direct database verification (skipped when testing a remote BASE_URL)
    slow: takes several seconds
